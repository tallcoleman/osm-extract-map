<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Link preview card, rendered to web/public/og-image.png (see docs/implementation-plan.md).
       The icon is web/public/favicon.svg at 10x; keep the two in step. -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(70 155) scale(10)">
    <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#0072b2" stroke-width="4"/>
    <rect x="12" y="12" width="16" height="16" rx="2" fill="none" stroke="#b84a00" stroke-width="4"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="430" y="280" font-size="76" font-weight="bold" fill="#1d2125">OSM Extracts Map</text>
    <text x="432" y="348" font-size="31" fill="#59616a">Compare OpenStreetMap extracts and</text>
    <text x="432" y="390" font-size="31" fill="#59616a">estimate the download size for the</text>
    <text x="432" y="432" font-size="31" fill="#59616a">areas you need.</text>
  </g>
</svg>
