server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/javascript text/css image/svg+xml;

    # index.html, config.json and anything else at the top level: revalidate (ETag).
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output never changes.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # MapLibre's worker (maplibre-gl-worker-<hash>.mjs). nginx's mime.types has no
        # .mjs, and with nosniff a module worker served as octet-stream won't run.
        location ~ \.mjs$ {
            types { text/javascript mjs; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # The current release from the data volume. Both trailing slashes matter:
    # without them a request like /data../ could reach the parent directory.
    location /data/ {
        alias /srv/data/current/;
        types {
            application/json json;
            application/geo+json geojson;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
