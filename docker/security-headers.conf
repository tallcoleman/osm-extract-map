# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own, so they can't simply be inherited.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only what MapLibre and the MapTiler "dataviz" style need. MapLibre's worker is a
# same-origin module file (worker-src 'self'). A Permissions-Policy, if added,
# must allow geolocation=(self) for the location button.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.maptiler.com; img-src 'self' data: blob: https://api.maptiler.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
